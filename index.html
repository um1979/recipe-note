<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta name="theme-color" content="#2f6b4f">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="레시피 수첩">
<title>내 레시피 수첩</title>
<style>
  :root{--bg:#f7f5f0;--card:#fff;--ink:#222;--sub:#777;--accent:#2f6b4f;--line:#e4e0d6;--soft:#eaf3ee}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:600px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;margin:8px 0 16px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px}
  button:disabled{opacity:.5;cursor:default}
  .primary{background:var(--accent);color:#fff;font-weight:600}
  .ghost{background:transparent;color:var(--accent);padding:6px 8px}
  .danger{background:transparent;color:#b3382c;padding:6px 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .item{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  .item b{font-size:16px}.meta{color:var(--sub);font-size:13px;margin-top:2px}
  .empty{color:var(--sub);text-align:center;padding:30px 0;line-height:1.6}
  label.l{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
  input[type=text],input[type=number],input[type=email],textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}
  textarea{min-height:90px;resize:vertical}
  h2{font-size:16px;margin:20px 0 8px}
  .chk{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);font-size:18px;line-height:1.5;cursor:pointer}
  .chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);flex:none}
  .chk.done span{text-decoration:line-through;color:#aaa}
  .num{color:var(--accent);font-weight:700;flex:none}
  .row{display:flex;gap:8px;margin-top:16px}
  .hint{font-size:12px;color:var(--sub);margin-top:24px;text-align:center;line-height:1.6}
  .box{background:var(--soft);border-radius:14px;padding:14px 16px;margin-bottom:6px}
  .box p{margin:0 0 8px;font-size:13px;color:#4a6b5a;line-height:1.5}
  .msg{font-size:13px;margin-top:8px;line-height:1.5}.err{color:#b3382c}.ok{color:var(--accent)}
  a{color:var(--accent)}
  a.linkbtn{display:inline-block;text-decoration:none;border-radius:10px;padding:10px 14px;white-space:nowrap;font-weight:600}
  a.linkbtn.ghost{padding:6px 8px;color:var(--accent)}
  .wrap{padding-bottom:170px}
  .tbtns{display:flex;flex-wrap:wrap;gap:6px;padding:8px 4px 10px 38px;border-bottom:1px solid var(--line)}
  .tbtn{background:var(--soft);color:var(--accent);font-weight:600;padding:8px 12px}
  #timers{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;display:flex;flex-direction:column;gap:6px;z-index:10;pointer-events:none}
  .tm{pointer-events:auto;max-width:600px;margin:0 auto;width:100%;background:#222;color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .tm.done{background:#b3382c;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.7}}
  .tm .time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .tm button{background:#fff;color:#222;padding:8px 12px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="timers"></div>
<script>
var recipes = [{
  id: 1, name: "닭가슴살 샐러드", time: 15, source: "",
  ingredients: "닭가슴살 1조각\n로메인 한 줌\n방울토마토 6개\n올리브오일 1스푼\n레몬즙 1스푼",
  steps: "닭가슴살을 소금, 후추로 밑간한다\n팬에 앞뒤로 5분씩 굽는다\n채소를 씻어 물기를 뺀다\n닭가슴살을 썰어 채소 위에 올린다\n올리브오일과 레몬즙을 뿌린다",
  saved: "2026-11-21"
},{
  id: 2, name: "애호박 볶음 (예시)", time: 15, source: "",
  ingredients: "애호박 1개\n양파 반 개\n들기름 1스푼\n소금 약간",
  steps: "애호박과 양파를 한입 크기로 썬다\n팬에 들기름을 두르고 양파를 넣어 강불에서 2분 볶는다\n애호박을 넣고 강불로 10분 볶는다\n소금으로 간을 한다",
  saved: "2026-11-21"
}];
var view = "list", current = null, draft = null, busy = false, note = "", noteErr = false, checks = {};
try { var s = localStorage.getItem("recipes2"); if (s) recipes = JSON.parse(s); } catch (e) {}
function save(){ try { localStorage.setItem("recipes2", JSON.stringify(recipes)); } catch (e) {} }
function esc(t){ return String(t == null ? "" : t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function lines(t){ return String(t || "").split("\n").map(function(x){return x.trim();}).filter(Boolean); }
function find(id){ return recipes.filter(function(x){return x.id === id;})[0]; }

function render(){
  var app = document.getElementById("app"), h = "";
  if (CLOUD && !authUser) { app.innerHTML = loginHtml(); return; }
  if (view === "list") {
    h += '<div class="top"><h1>🍳 내 레시피 수첩</h1><button class="primary" onclick="openForm()">+ 자료로 추가</button></div>';
    h += '<div class="card" style="padding:10px 12px"><div style="display:flex;gap:8px;align-items:center"><input type="text" id="yt-q" placeholder="유튜브에서 찾고 싶은 요리 검색" value="' + esc(ytq) + '" oninput="updYt()" onkeydown="ytKey(event)"><a id="yt-go" class="primary linkbtn" target="_blank" rel="noopener" href="' + ytUrl(ytq) + '">▶ 검색</a></div><div class="meta">누르면 유튜브가 새 창으로 열려요. 영상을 보다가 링크를 복사해서 "+ 자료로 추가"에 넣으면 돼요.</div></div>';
    if (!recipes.length) h += '<div class="empty">아직 레시피가 없어요.<br>유튜브 설명글이나 레시피 글을 붙여 넣으면<br>Claude가 칸을 채워 줘요.</div>';
    recipes.forEach(function(r){
      h += '<div class="card item" onclick="openDetail(' + r.id + ')"><div><b>' + esc(r.name) + '</b><div class="meta">조리 ' + esc(r.time) + '분 · 재료 ' + lines(r.ingredients).length + '개 · 단계 ' + lines(r.steps).length + '개</div></div><span>›</span></div>';
    });
    if (CLOUD) h += '<div class="hint">' + esc(authUser.email) + ' 로그인 중 · <a href="#" onclick="logout();return false">로그아웃</a><br>레시피는 내 계정에 저장돼요.</div>';
    else h += '<div class="hint">미리보기 화면이에요. 저장은 이 브라우저에만 돼요.</div>';
  } else if (view === "detail") {
    var r = find(current), c = checks[r.id] || (checks[r.id] = {});
    h += '<button class="ghost" onclick="goList()">‹ 목록</button><h1>' + esc(r.name) + '</h1><div class="meta">조리시간 ' + esc(r.time) + '분 · 저장한 날 ' + esc(r.saved) + '</div>';
    if (isUrl(r.source)) h += '<div style="margin-top:10px"><a class="primary linkbtn" href="' + esc(r.source) + '" target="_blank" rel="noopener">▶ 원본 영상·글 열기</a></div>';
    h += '<div class="card" style="display:flex;gap:8px;align-items:center;margin-top:12px"><span>⏱ 직접 타이머</span><input type="number" id="c-min" inputmode="decimal" placeholder="몇 분" style="width:90px"><button class="primary" onclick="startCustom()">시작</button></div>';
    h += '<h2>🛒 재료 (챙기면 눌러요)</h2><div class="card" style="padding:4px 12px">';
    lines(r.ingredients).forEach(function(x, i){
      var k = "i" + i;
      h += '<label class="chk' + (c[k] ? ' done' : '') + '"><input type="checkbox"' + (c[k] ? ' checked' : '') + ' onchange="tick(' + r.id + ',\'' + k + '\')"><span>' + esc(x) + '</span></label>';
    });
    h += '</div><h2>👩‍🍳 조리 순서 (끝내면 눌러요)</h2><div class="card" style="padding:4px 12px">';
    lines(r.steps).forEach(function(x, i){
      var k = "s" + i;
      h += '<label class="chk' + (c[k] ? ' done' : '') + '"><input type="checkbox"' + (c[k] ? ' checked' : '') + ' onchange="tick(' + r.id + ',\'' + k + '\')"><span><span class="num">' + (i + 1) + '.</span> ' + esc(x) + '</span></label>' + timerBtns(r.id, i, x);
    });
    h += '</div><div class="row"><button class="ghost" onclick="resetChecks(' + r.id + ')">체크 모두 지우기</button><button class="danger" onclick="del(' + r.id + ')">삭제</button></div>';
  } else {
    h += '<button class="ghost" onclick="goList()">‹ 취소</button><h1>자료로 레시피 추가</h1>';
    h += '<div class="box"><p><b>1단계.</b> 유튜브 링크를 붙여 넣으면 Claude가 영상 설명과 자막을 가져와서 칸을 자동으로 채워요. 안 채워지면 아래 버튼을 눌러요.<br>자막이 없거나 안 읽히면, 설명글·블로그 글을 아래 칸에 붙여 넣어 주세요.</p>';
    h += '<label class="l">영상 링크</label><input type="text" id="f-src" placeholder="https://youtube.com/..." oninput="updSrc()" value="' + esc(draft && draft.source) + '">';
    h += '<a id="src-open" class="ghost linkbtn" target="_blank" rel="noopener" href="' + (isUrl(draft && draft.source) ? esc(draft.source) : '#') + '" style="display:' + (isUrl(draft && draft.source) ? 'inline-block' : 'none') + ';margin-top:4px">▶ 영상 열어서 보기</a>';
    h += '<label class="l">붙여 넣을 자료 (링크만 쓰면 비워 둬요)</label><textarea id="f-raw" style="min-height:140px" placeholder="여기에 설명글이나 자막을 붙여 넣어요">' + esc(draft && draft.raw) + '</textarea>';
    h += '<div class="row"><button class="primary" id="btn-ai" onclick="organize()"' + (busy ? ' disabled' : '') + '>' + (busy ? '정리하는 중…' : '✨ 칸 자동으로 채우기') + '</button></div>';
    if (note) h += '<div class="msg ' + (noteErr ? 'err' : 'ok') + '">' + esc(note) + '</div>';
    h += '</div>';
    h += '<h2>2단계. 채워진 내용 확인하고 고치기</h2>';
    h += '<label class="l">이름</label><input type="text" id="f-name" value="' + esc(draft && draft.name) + '">';
    h += '<label class="l">조리시간 (분)</label><input type="number" id="f-time" inputmode="numeric" value="' + esc(draft && draft.time) + '">';
    h += '<label class="l">재료 (한 줄에 하나씩)</label><textarea id="f-ing">' + esc(draft && draft.ingredients) + '</textarea>';
    h += '<label class="l">조리 순서 (한 줄에 한 단계씩)</label><textarea id="f-steps">' + esc(draft && draft.steps) + '</textarea>';
    h += '<div class="row"><button class="primary" onclick="add()">저장하기</button></div>';
  }
  app.innerHTML = h;
}
function readForm(){
  function v(id){ var e = document.getElementById(id); return e ? e.value : ""; }
  draft = { source: v("f-src"), raw: v("f-raw"), name: v("f-name"), time: v("f-time"), ingredients: v("f-ing"), steps: v("f-steps") };
}
function goList(){ view = "list"; render(); }
function openForm(){ draft = { source: "", raw: "", name: "", time: "", ingredients: "", steps: "" }; note = ""; busy = false; view = "form"; render(); }
function openDetail(id){ current = id; view = "detail"; render(); }
function tick(id, k){ var c = checks[id] || (checks[id] = {}); c[k] = !c[k]; render(); }
function resetChecks(id){ checks[id] = {}; render(); }
function add(){
  readForm();
  if (!draft.name.trim()) { note = "이름을 먼저 채워 주세요."; noteErr = true; render(); return; }
  if (CLOUD) { cloudAdd(); return; }
  recipes.unshift({ id: Date.now(), name: draft.name.trim(), time: draft.time || "?", source: draft.source.trim(),
    ingredients: draft.ingredients, steps: draft.steps, saved: new Date().toISOString().slice(0, 10) });
  save(); note = ""; goList();
}
function del(id){ if (CLOUD) { cloudDel(id); return; } recipes = recipes.filter(function(x){return x.id !== id;}); save(); goList(); }

var timers = [], tmSeq = 0, audioCtx = null, ringIv = null, ringCount = 0, tmShape = "";
function ensureAudio(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function beep(){
  try {
    if (audioCtx) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = 880; g.gain.value = 0.35;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.3);
    }
  } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) {}
}
function timerBtns(rid, i, text){
  var out = "", m, re = /(\d+)\s*(분|초)/g;
  while ((m = re.exec(text))) {
    var n = parseInt(m[1], 10), secs = (m[2] === "분") ? n * 60 : n;
    out += '<button class="tbtn" onclick="startTimer(' + rid + ',' + i + ',' + secs + ')">⏱ ' + n + m[2] + ' 타이머 시작</button>';
  }
  return out ? '<div class="tbtns">' + out + '</div>' : "";
}
function addTimer(label, secs){
  ensureAudio();
  timers.push({ id: ++tmSeq, label: label, end: Date.now() + secs * 1000, done: false });
  drawTimers();
}
function startTimer(rid, si, secs){ var r = find(rid); addTimer((r ? r.name : "") + " · " + (si + 1) + "단계", secs); }
function startCustom(){
  var e = document.getElementById("c-min"), v = e ? parseFloat(e.value) : 0;
  if (!v || v <= 0) { if (e) e.focus(); return; }
  addTimer("직접 타이머 " + v + "분", Math.round(v * 60));
}
function dismissTimer(id){
  timers = timers.filter(function(t){ return t.id !== id; });
  if (!timers.some(function(t){ return t.done; })) stopRing();
  drawTimers();
}
function stopRing(){ if (ringIv) { clearInterval(ringIv); ringIv = null; } ringCount = 0; }
function startRing(){
  if (ringIv) return;
  ringCount = 0; beep();
  ringIv = setInterval(function(){ ringCount++; if (ringCount > 40) { stopRing(); return; } beep(); }, 1000);
}
function fmt(s){ s = Math.max(0, Math.ceil(s)); var m = Math.floor(s / 60), x = s % 60; return (m < 10 ? "0" : "") + m + ":" + (x < 10 ? "0" : "") + x; }
function drawTimers(){
  var el = document.getElementById("timers"); if (!el) return;
  var shape = timers.map(function(t){ return t.id + (t.done ? "d" : "r"); }).join(",");
  if (shape !== tmShape) {
    tmShape = shape;
    el.innerHTML = timers.map(function(t){
      return '<div class="tm' + (t.done ? ' done' : '') + '"><div><div style="font-size:12px;opacity:.8">' + esc(t.label) + '</div><div class="time" id="tm-' + t.id + '">' + (t.done ? "⏰ 끝났어요!" : fmt((t.end - Date.now()) / 1000)) + '</div></div><button onclick="dismissTimer(' + t.id + ')">' + (t.done ? '알람 끄기' : '취소') + '</button></div>';
    }).join("");
  } else {
    timers.forEach(function(t){
      if (!t.done) { var e = document.getElementById("tm-" + t.id); if (e) e.textContent = fmt((t.end - Date.now()) / 1000); }
    });
  }
}
setInterval(function(){
  var now = Date.now(), fin = false;
  timers.forEach(function(t){ if (!t.done && now >= t.end) { t.done = true; fin = true; } });
  if (fin) startRing();
  drawTimers();
}, 500);

var SB_URL = "https://gujvlxwiggvhwyqhwpyt.supabase.co";
var SB_KEY = "sb_publishable_3-lFi36ILFvapBex96Torw_bf1nCW3U";
var CLOUD = (typeof claude === "undefined") && (typeof supabase !== "undefined"), sb = null, authUser = null, authMsg = "", authErr = false, authBusy = false, authEmail = "";
function loginHtml(){
  return '<h1>🍳 내 레시피 수첩</h1><div class="box"><p><b>로그인</b><br>이메일을 적으면 로그인 링크를 보내 드려요. 비밀번호는 필요 없어요.</p>' +
    '<label class="l">이메일</label><input type="email" id="login-email" placeholder="me@example.com" value="' + esc(authEmail) + '" onkeydown="if(event.key===\'Enter\')sendLink()">' +
    '<div class="row"><button class="primary" onclick="sendLink()"' + (authBusy ? ' disabled' : '') + '>' + (authBusy ? '보내는 중…' : '로그인 링크 받기') + '</button></div>' +
    (authMsg ? '<div class="msg ' + (authErr ? 'err' : 'ok') + '">' + esc(authMsg) + '</div>' : '') + '</div>';
}
async function sendLink(){
  var e = document.getElementById("login-email"); authEmail = e ? e.value.trim() : authEmail;
  if (!authEmail) { authMsg = "이메일을 적어 주세요."; authErr = true; render(); return; }
  authBusy = true; authMsg = ""; render();
  var r = await sb.auth.signInWithOtp({ email: authEmail, options: { emailRedirectTo: location.origin + location.pathname } });
  authBusy = false;
  if (r.error) { authMsg = "메일을 보내지 못했어요. 잠시 뒤에 다시 해 주세요. (" + r.error.message + ")"; authErr = true; }
  else { authMsg = "로그인 메일을 보냈어요. 메일에 있는 링크를 눌러 주세요."; authErr = false; }
  render();
}
async function logout(){ await sb.auth.signOut(); }
async function loadCloud(){
  var r = await sb.from("recipes").select("*").order("created_at", { ascending: false });
  if (r.error) { recipes = []; note = "레시피를 불러오지 못했어요. (" + r.error.message + ")"; noteErr = true; }
  else recipes = r.data.map(function(d, i){ return { id: i + 1, uid: d.id, name: d.name, time: d.cook_minutes == null ? "?" : d.cook_minutes, source: d.source_url || "", ingredients: d.ingredients, steps: d.steps, saved: String(d.created_at).slice(0, 10) }; });
  render();
}
async function cloudAdd(){
  var r = await sb.from("recipes").insert({ name: draft.name.trim(), cook_minutes: parseInt(draft.time, 10) >= 0 ? parseInt(draft.time, 10) : null, ingredients: draft.ingredients, steps: draft.steps, source_url: draft.source.trim() || null });
  if (r.error) { note = "저장하지 못했어요. (" + r.error.message + ")"; noteErr = true; render(); return; }
  note = ""; view = "list"; await loadCloud();
}
async function cloudDel(id){
  var x = find(id); if (!x || !x.uid) return;
  var r = await sb.from("recipes").delete().eq("id", x.uid);
  view = "list"; await loadCloud();
}
async function initCloud(){
  recipes = [];
  sb = supabase.createClient(SB_URL, SB_KEY);
  var r = await sb.auth.getSession();
  authUser = r.data && r.data.session ? r.data.session.user : null;
  sb.auth.onAuthStateChange(function(ev, session){
    var u = session ? session.user : null;
    var changed = (u ? u.id : "") !== (authUser ? authUser.id : "");
    authUser = u;
    if (changed) { if (u) loadCloud(); else { recipes = []; view = "list"; render(); } }
  });
  if (authUser) await loadCloud(); else render();
}
var ytq = "", autoTimer = null;
function isUrl(u){ return /^https?:\/\/\S+$/.test(String(u || "").trim()); }
function ytId(u){
  var m = String(u || "").trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#]*&)?v=|shorts\/|embed\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : "";
}
function ytUrl(q){ return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q || ""); }
function updYt(){ var e = document.getElementById("yt-q"); if (!e) return; ytq = e.value; document.getElementById("yt-go").href = ytUrl(ytq); }
function ytKey(ev){ if (ev.key === "Enter") { updYt(); var a = document.getElementById("yt-go"); if (a) a.click(); } }
function updSrc(){
  var e = document.getElementById("f-src"), a = document.getElementById("src-open"); if (!e || !a) return;
  var v = e.value.trim(), ok = isUrl(v);
  a.href = ok ? v : "#"; a.style.display = ok ? "inline-block" : "none";
  clearTimeout(autoTimer);
  if (typeof claude !== "undefined" && ytId(v) && !busy) {
    autoTimer = setTimeout(function(){
      readForm();
      if (ytId(draft.source) && !draft.raw.trim() && !draft.name.trim() && !draft.ingredients.trim() && !draft.steps.trim() && !busy) organize();
    }, 700);
  }
}
async function fetchVideo(vid){
  var mcp = await claude.use("mcp");
  if (!mcp) throw { message: "이 화면에서는 영상 정보를 가져올 수 없어요. 설명글을 아래 칸에 붙여 넣어 주세요." };
  var S = "PlayMCP", parts = [], got = [], lastErr = null;
  function pick(p){
    if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { return null; } }
    return p && (p[vid] || p);
  }
  try {
    var d = await mcp.callTool(S, "YouTubeData-get_video_details", { video_ids: [vid], description_detail: "LONG" });
    var v = pick(d.payload);
    if (v && (v.title || v.description)) { parts.push("제목: " + (v.title || "") + "\n설명: " + (v.description || "")); got.push("설명"); }
  } catch (e) { lastErr = e; }
  var langs = ["ko", "en"];
  for (var i = 0; i < langs.length; i++) {
    try {
      var t = await mcp.callTool(S, "YouTubeData-get_transcripts", { video_ids: [vid], lang: langs[i], format_type: "full_text" });
      var tv = pick(t.payload);
      if (tv && tv.text) { parts.push("자막:\n" + tv.text); got.push("자막"); break; }
    } catch (e) { lastErr = lastErr || e; }
  }
  if (!parts.length) {
    var c = lastErr && lastErr.code;
    if (c === "server_not_connected" || c === "needs_reauth" || c === "selection_required") throw { message: "영상 정보를 가져오는 연결(PlayMCP)이 안 되어 있어요. claude.ai 설정의 커넥터에서 연결을 확인해 주세요. 지금은 설명글을 아래 칸에 붙여 넣어 주세요." };
    if (c === "approval_required" || c === "not_in_manifest" || c === "consent_required") throw { message: "영상 정보를 가져오는 허락이 필요해요. 허락 창이 뜨면 허용해 주세요. 지금은 설명글을 아래 칸에 붙여 넣어도 돼요." };
    throw { message: "영상 설명과 자막을 가져오지 못했어요. 설명글을 아래 칸에 붙여 넣어 주세요." };
  }
  return { text: parts.join("\n\n"), from: got.join("과 ") };
}
async function organize(){
  readForm();
  var material = draft.raw.trim(), vid = ytId(draft.source), usedFrom = "";
  if (!material && !vid) { note = draft.source.trim() ? "유튜브 영상 주소로 읽을 수 없어요. 주소가 맞는지 확인하거나, 설명글을 아래 칸에 붙여 넣어 주세요." : "유튜브 링크를 넣거나, 자료를 붙여 넣어 주세요."; noteErr = true; render(); return; }
  if (typeof claude === "undefined") { note = "자동 채우기는 Claude 안에서만 돼요. 지금은 아래 칸에 이름, 재료, 순서를 직접 적어 주세요."; noteErr = true; render(); return; }
  busy = true; note = ""; render();
  try {
    if (!material) { var fv = await fetchVideo(vid); material = fv.text; usedFrom = fv.from; }
    var sample = await claude.use("sample");
    if (!sample) throw { message: "이 화면에서는 자동 정리를 쓸 수 없어요. 아래 칸에 직접 적어 주세요." };
    var prompt = "아래 자료는 요리 레시피 설명이야. 자료에 실제로 있는 내용만 써서 JSON 하나만 출력해. 설명 문장이나 코드블록 표시는 쓰지 마.\n" +
      "형식: {\"name\":\"요리 이름\",\"time\":분 단위 숫자 또는 null,\"ingredients\":[\"재료 + 분량\"],\"steps\":[\"한 단계씩 짧은 문장\"]}\n" +
      "규칙: 불 세기(강불·중불·약불)와 시간(몇 분)이 자료에 있으면 해당 단계 문장에 '강불에서 10분'처럼 그대로 넣어. 자료에 없는 재료, 분량, 시간은 지어내지 마. 모르면 time은 null, 분량은 빼고 재료 이름만 써. 한국어로 써.\n\n자료:\n" + material.slice(0, 12000);
    var out = await sample(prompt, { cache: false });
    var m = String(out.text || "").match(/\{[\s\S]*\}/);
    if (!m) throw { message: "정리 결과를 읽지 못했어요. 다시 눌러 주세요." };
    var j = JSON.parse(m[0]);
    draft.name = j.name || draft.name;
    draft.time = (j.time != null ? j.time : draft.time);
    draft.ingredients = (j.ingredients || []).join("\n");
    draft.steps = (j.steps || []).join("\n");
    note = (usedFrom ? "영상의 " + usedFrom + "(으)로 채웠어요. " : "채웠어요. ") + (usedFrom === "설명" ? "자막은 못 가져와서 설명 앞부분만 썼어요. 부족하면 설명글을 붙여 넣어 주세요. " : "") + "아래 내용이 맞는지 확인하고 고쳐 주세요."; noteErr = false;
  } catch (e) {
    note = (e && e.code === "not_granted") ? "자동 정리 사용을 허락해야 해요." : ((e && e.message) || "정리에 실패했어요. 다시 눌러 주세요.");
    noteErr = true;
  }
  busy = false; render();
}
